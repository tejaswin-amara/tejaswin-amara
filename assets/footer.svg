<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%">
  <defs>
    <!-- Beautiful Animated Gradient shifting between Teal, Cyan, and Slate -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#0f292d;#1e1b4b;#0f172a" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="40%" stop-color="#0f5e54">
        <animate attributeName="stop-color" values="#0f5e54;#115e59;#1e3a8a;#0f5e54" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="80%" stop-color="#115e59">
        <animate attributeName="stop-color" values="#115e59;#0f766e;#0d9488;#115e59" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f766e">
        <animate attributeName="stop-color" values="#0f766e;#0891b2;#06b6d4;#0f766e" dur="15s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Waving Path with Fluid Morphing Animation matching the header -->
  <path d="M0,60 C100,80 200,40 500,70 C800,100 1000,50 1200,80 L1200,120 L0,120 Z" fill="url(#grad)">
    <animate attributeName="d" 
             dur="10s" 
             repeatCount="indefinite"
             values="M0,60 C100,80 200,40 500,70 C800,100 1000,50 1200,80 L1200,120 L0,120 Z;
                     M0,80 C120,50 180,90 480,50 C780,90 980,40 1200,60 L1200,120 L0,120 Z;
                     M0,60 C100,80 200,40 500,70 C800,100 1000,50 1200,80 L1200,120 L0,120 Z" />
  </path>
</svg>
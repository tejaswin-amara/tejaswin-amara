<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-stack desc-stack" viewBox="0 0 1200 430" width="100%">
  <title id="title-stack">Technical Stack and Tooling Matrix — Languages, Frameworks, Cloud Infrastructure, and Agentic Governance</title>
  <desc id="desc-stack">Structured badge matrix of Tejaswin Amara&#x27;s technical stack across Python, TypeScript, Java 21, C, Go, Next.js, Spring Boot, Docker, PostgreSQL, Cloudflare, Supabase, and MCP toolchains.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005461" />
      <stop offset="50%" stop-color="#018790" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b7b5" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#005461" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00b7b5" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 56px; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 15px; fill: #22d3ee; letter-spacing: 2.5px; }
      .tagline { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #cbd5e1; }
      .section-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #f8fafc; }
      .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #22d3ee; }
      .card-meta { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 12px; fill: #38bdf8; }
      .card-desc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13.5px; fill: #cbd5e1; }
      .cat-label { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 700; font-size: 13px; fill: #94a3b8; letter-spacing: 1.5px; }
      .badge-text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 13.5px; fill: #f8fafc; }
      .term-prompt { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 700; font-size: 14.5px; fill: #00b7b5; }
      .term-cmd { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 14.5px; fill: #38bdf8; }
      .term-out { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 400; font-size: 14px; fill: #e2e8f0; }
      .footer-text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 500; font-size: 13px; fill: #94a3b8; letter-spacing: 1px; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1.2s step-end infinite; fill: #22d3ee; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
      
      .header-text {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #f8fafc;
      }
      .stack-category {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .tech-badge {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #f8fafc;
      }

      /* Floating animation */
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      .float-1 { animation: float1 4s ease-in-out infinite; }
      .float-2 { animation: float2 5s ease-in-out infinite; }
      
      .tech-box {
        fill: rgba(30, 41, 59, 0.5);
        stroke: #38bdf8;
        stroke-width: 1;
        rx: 8;
      }
      .tech-box-2 {
        fill: rgba(30, 41, 59, 0.5);
        stroke: #818cf8;
        stroke-width: 1;
        rx: 8;
      }
      .tech-box-3 {
        fill: rgba(30, 41, 59, 0.5);
        stroke: #22d3ee;
        stroke-width: 1;
        rx: 8;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <g transform="translate(100, 50)">
    <text x="0" y="20" class="header-text" filter="url(#glow)">⚡ Tech Stack</text>
    <path d="M 0 40 L 200 40" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#glow)"/>

    <!-- Category 1: Languages -->
    <text x="0" y="90" class="stack-category">Languages</text>
    <g class="float-1" transform="translate(0, 110)">
      <rect x="0" y="0" width="120" height="36" class="tech-box" filter="url(#glow)"/>
      <text x="60" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">TypeScript</text>
    </g>
    <g class="float-2" transform="translate(135, 110)">
      <rect x="0" y="0" width="80" height="36" class="tech-box" filter="url(#glow)"/>
      <text x="40" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Java</text>
    </g>
    <g class="float-1" transform="translate(230, 110)">
      <rect x="0" y="0" width="90" height="36" class="tech-box" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Python</text>
    </g>
    <g class="float-2" transform="translate(335, 110)">
      <rect x="0" y="0" width="120" height="36" class="tech-box" filter="url(#glow)"/>
      <text x="60" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">PowerShell</text>
    </g>

    <!-- Category 2: Frameworks -->
    <text x="0" y="190" class="stack-category">Frameworks &amp; Libraries</text>
    <g class="float-2" transform="translate(0, 210)">
      <rect x="0" y="0" width="100" height="36" class="tech-box-2" filter="url(#glow)"/>
      <text x="50" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Next.js</text>
    </g>
    <g class="float-1" transform="translate(115, 210)">
      <rect x="0" y="0" width="90" height="36" class="tech-box-2" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">React</text>
    </g>
    <g class="float-2" transform="translate(220, 210)">
      <rect x="0" y="0" width="130" height="36" class="tech-box-2" filter="url(#glow)"/>
      <text x="65" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Spring Boot</text>
    </g>
    <g class="float-1" transform="translate(365, 210)">
      <rect x="0" y="0" width="140" height="36" class="tech-box-2" filter="url(#glow)"/>
      <text x="70" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Tailwind CSS</text>
    </g>
    <g class="float-2" transform="translate(520, 210)">
      <rect x="0" y="0" width="90" height="36" class="tech-box-2" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Frappe</text>
    </g>

    <!-- Category 3: AI & Infra -->
    <text x="650" y="90" class="stack-category">AI &amp; Infrastructure</text>
    <g class="float-1" transform="translate(650, 110)">
      <rect x="0" y="0" width="90" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Claude</text>
    </g>
    <g class="float-2" transform="translate(755, 110)">
      <rect x="0" y="0" width="90" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Gemini</text>
    </g>
    <g class="float-1" transform="translate(860, 110)">
      <rect x="0" y="0" width="90" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Docker</text>
    </g>
    <g class="float-2" transform="translate(965, 110)">
      <rect x="0" y="0" width="90" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="45" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Railway</text>
    </g>
    
    <g class="float-2" transform="translate(650, 160)">
      <rect x="0" y="0" width="80" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="40" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Figma</text>
    </g>
    <g class="float-1" transform="translate(745, 160)">
      <rect x="0" y="0" width="80" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="40" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Canva</text>
    </g>
    <g class="float-2" transform="translate(840, 160)">
      <rect x="0" y="0" width="100" height="36" class="tech-box-3" filter="url(#glow)"/>
      <text x="50" y="23" dominant-baseline="middle" text-anchor="middle" class="tech-badge">Windows</text>
    </g>
  </g>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @keyframes countUp {
        from { fill: #64748b; }
        to { fill: #14b8a6; }
      }
      .stat-box { animation: slideIn 0.6s ease-out forwards; }
      .stat-box:nth-child(2) { animation-delay: 0.1s; }
      .stat-box:nth-child(3) { animation-delay: 0.2s; }
      .stat-box:nth-child(4) { animation-delay: 0.3s; }
      .stat-value { animation: countUp 1.5s ease-out forwards; font-weight: 700; }
      .stat-label { fill: #94a3b8; font-size: 12px; font-family: "JetBrains Mono", monospace; }
      .icon { animation: fadeIn 0.8s ease-out forwards; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0f172a"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Gradient accent -->
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#accentGrad)"/>

  <!-- Title -->
  <text x="400" y="50" font-size="36" font-weight="700" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace">
    Activity & Stats
  </text>

  <!-- Stat boxes -->
  <g class="stat-box">
    <rect x="30" y="80" width="170" height="110" rx="8" fill="#1e293b" stroke="#134e4a" stroke-width="1"/>
    <circle class="icon" cx="60" cy="110" r="20" fill="#14b8a6" opacity="0.2"/>
    <text class="stat-value" x="130" y="125" font-size="28" text-anchor="end" fill="#14b8a6">35+</text>
    <text class="stat-label" x="130" y="145" text-anchor="end">Projects shipped</text>
  </g>

  <g class="stat-box">
    <rect x="215" y="80" width="170" height="110" rx="8" fill="#1e293b" stroke="#134e4a" stroke-width="1"/>
    <circle class="icon" cx="245" cy="110" r="20" fill="#06b6d4" opacity="0.2"/>
    <text class="stat-value" x="315" y="125" font-size="28" text-anchor="end" fill="#06b6d4">8.11</text>
    <text class="stat-label" x="315" y="145" text-anchor="end">CGPA (KL)</text>
  </g>

  <g class="stat-box">
    <rect x="400" y="80" width="170" height="110" rx="8" fill="#1e293b" stroke="#134e4a" stroke-width="1"/>
    <circle class="icon" cx="430" cy="110" r="20" fill="#a78bfa" opacity="0.2"/>
    <text class="stat-value" x="510" y="125" font-size="28" text-anchor="end" fill="#a78bfa">5</text>
    <text class="stat-label" x="510" y="145" text-anchor="end">Languages</text>
  </g>

  <g class="stat-box">
    <rect x="585" y="80" width="185" height="110" rx="8" fill="#1e293b" stroke="#134e4a" stroke-width="1"/>
    <circle class="icon" cx="620" cy="110" r="20" fill="#f97316" opacity="0.2"/>
    <text class="stat-value" x="750" y="125" font-size="28" text-anchor="end" fill="#f97316">2026</text>
    <text class="stat-label" x="750" y="145" text-anchor="end">Active since</text>
  </g>

  <!-- Skills section -->
  <text x="30" y="240" font-size="18" font-weight="600" fill="#e2e8f0" font-family="'JetBrains Mono', monospace">Top skills</text>

  <g opacity="0.9">
    <rect x="30" y="260" width="110" height="30" rx="4" fill="#134e4a"/>
    <text x="85" y="282" font-size="14" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-weight="600">TypeScript</text>
  </g>

  <g opacity="0.9">
    <rect x="155" y="260" width="110" height="30" rx="4" fill="#134e4a"/>
    <text x="210" y="282" font-size="14" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-weight="600">React/Next.js</text>
  </g>

  <g opacity="0.9">
    <rect x="280" y="260" width="110" height="30" rx="4" fill="#134e4a"/>
    <text x="335" y="282" font-size="14" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-weight="600">AI/LLMs</text>
  </g>

  <g opacity="0.9">
    <rect x="405" y="260" width="110" height="30" rx="4" fill="#134e4a"/>
    <text x="460" y="282" font-size="14" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-weight="600">Full-stack</text>
  </g>

  <g opacity="0.9">
    <rect x="530" y="260" width="110" height="30" rx="4" fill="#134e4a"/>
    <text x="585" y="282" font-size="14" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-weight="600">Auditing</text>
  </g>

  <g opacity="0.9">
    <rect x="655" y="260" width="130" height="30" rx="4" fill="#134e4a"/>
    <text x="720" y="282" font-size="14" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-weight="600">System Design</text>
  </g>

  <!-- Recent highlights -->
  <text x="30" y="330" font-size="18" font-weight="600" fill="#e2e8f0" font-family="'JetBrains Mono', monospace">Highlights</text>

  <text x="30" y="360" font-size="13" fill="#cbd5e1" font-family="'JetBrains Mono', monospace">
    <tspan>✦ ICACIML 2026: Published federated learning research for IoMT security</tspan>
  </text>

  <text x="30" y="382" font-size="13" fill="#cbd5e1" font-family="'JetBrains Mono', monospace">
    <tspan>✦ Origins Asia CT&SO: Overseeing strategic transition, distributed backend infrastructure</tspan>
  </text>

</svg>

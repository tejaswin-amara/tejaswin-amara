<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-projects desc-projects" viewBox="0 0 1200 490" width="100%">
  <title id="title-projects">Featured Engineering Systems and Open-Source Repositories by Tejaswin Amara</title>
  <desc id="desc-projects">Grid of eight flagship engineering systems: CampusConnect 2.0, Sovereign-OS, FounderGate, ChatLens, KL Sync and KLU ERP Autofill, Resume-Job Matching Engine, Fake News Detection MLOps, and Linux C Systems.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005461" />
      <stop offset="50%" stop-color="#018790" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b7b5" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#005461" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00b7b5" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 56px; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 15px; fill: #22d3ee; letter-spacing: 2.5px; }
      .tagline { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #cbd5e1; }
      .section-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #f8fafc; }
      .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #22d3ee; }
      .card-meta { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 12px; fill: #38bdf8; }
      .card-desc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13.5px; fill: #cbd5e1; }
      .cat-label { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 700; font-size: 13px; fill: #94a3b8; letter-spacing: 1.5px; }
      .badge-text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 13.5px; fill: #f8fafc; }
      .term-prompt { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 700; font-size: 14.5px; fill: #00b7b5; }
      .term-cmd { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 600; font-size: 14.5px; fill: #38bdf8; }
      .term-out { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 400; font-size: 14px; fill: #e2e8f0; }
      .footer-text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-weight: 500; font-size: 13px; fill: #94a3b8; letter-spacing: 1px; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1.2s step-end infinite; fill: #22d3ee; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </defs>
  <rect width="1200" height="490" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="490" rx="12" fill="url(#gridPattern)" />
  <g transform="translate(56, 36)">
    <text x="0" y="20" class="section-title">Featured Engineering Systems &amp; Open-Source Repositories</text>
    <rect x="0" y="32" width="620" height="2.5" rx="1.2" fill="url(#tealAccent)" />
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">CampusConnect 2.0</text>
      <text x="36" y="47" class="card-meta">Java 21 · Spring Boot 3.4 · TypeScript · MySQL 8 · Resilience4j</text>
      <text x="36" y="67" class="card-desc">Single-college campus event middleware with RBAC, waitlist concurrency control, Flyway migrations &amp; Bucket4j rate limits.</text>
    </g>
    <g transform="translate(555, 62)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">Sovereign-OS</text>
      <text x="36" y="47" class="card-meta">Go · PowerShell Core · Model Context Protocol (MCP)</text>
      <text x="36" y="67" class="card-desc">Zero-drift cloud-native AI agent operating system with atomic execution gates, persistent directives &amp; verification loops.</text>
    </g>
    <g transform="translate(0, 158)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">FounderGate</text>
      <text x="36" y="47" class="card-meta">Multi-Agent LLM Router · Safety Gate · HTML/TS</text>
      <text x="36" y="67" class="card-desc">Adversarial multi-agent customer discovery &amp; GTM engine enforcing prompt-injection sanitization and a human judgment gate.</text>
    </g>
    <g transform="translate(555, 158)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">ChatLens</text>
      <text x="36" y="47" class="card-meta">Python · Gemini API · Docker · PostgreSQL (pgvector) · Redis</text>
      <text x="36" y="67" class="card-desc">Containerized AI conversation intelligence and diagnostic platform for Telegram &amp; WhatsApp exports with semantic search.</text>
    </g>
    <g transform="translate(0, 254)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">KL Sync &amp; KLU ERP Autofill</text>
      <text x="36" y="47" class="card-meta">Next.js PWA · TypeScript · Manifest V3 · ONNX Runtime Web</text>
      <text x="36" y="67" class="card-desc">Real-time attendance tracker PWA with LTPS calculator paired with an on-device neural OCR CAPTCHA solver extension.</text>
    </g>
    <g transform="translate(555, 254)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">Resume–Job Matching &amp; Talent Engine</text>
      <text x="36" y="47" class="card-meta">Python · Network Flow · String DP · NP-Hard Approximation</text>
      <text x="36" y="67" class="card-desc">Hand-built algorithmic core implementing Dinic max-flow, KMP/Rabin-Karp, edit-distance DP &amp; parallel matching.</text>
    </g>
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">Fake News Detection (BERT &amp; LSTM MLOps)</text>
      <text x="36" y="47" class="card-meta">Python · Transformers · Platt Calibration · XAI · KS Drift SRE</text>
      <text x="36" y="67" class="card-desc">Production-grade verifiable NLP classification pipeline with sub-ms serving, explainable attribution &amp; drift monitoring.</text>
    </g>
    <g transform="translate(555, 350)">
      <rect x="0" y="0" width="530" height="82" rx="8" fill="#090d16" stroke="#018790" stroke-width="1.3" />
      <circle cx="20" cy="24" r="4.5" fill="#22d3ee" class="pulse" />
      <text x="36" y="28" class="card-title">Linux Allocator, Task Engine &amp; SETU Network</text>
      <text x="36" y="47" class="card-meta">C (POSIX Threads) · libmyalloc.so · /proc VFS · OSPF &amp; QoS</text>
      <text x="36" y="67" class="card-desc">Custom C heap allocator with /proc monitor, monotonic thread-pool HTTP server &amp; campus internetwork-as-code (SETU).</text>
    </g>
  </g>
</svg>

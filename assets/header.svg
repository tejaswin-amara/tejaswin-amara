<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs>
    <!-- Beautiful Animated Gradient shifting between Teal, Cyan, and Slate -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#0f292d;#1e1b4b;#0f172a" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="40%" stop-color="#0f5e54">
        <animate attributeName="stop-color" values="#0f5e54;#115e59;#1e3a8a;#0f5e54" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="80%" stop-color="#115e59">
        <animate attributeName="stop-color" values="#115e59;#0f766e;#0d9488;#115e59" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f766e">
        <animate attributeName="stop-color" values="#0f766e;#0891b2;#06b6d4;#0f766e" dur="15s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&amp;display=swap');
      .title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 58px;
        fill: #f8fafc;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #22d3ee;
        letter-spacing: 1px;
      }
      
      /* Subtle Floating Particles Animation */
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.2); opacity: 0.8; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      .particle {
        animation: floatParticle 8s ease-in-out infinite;
      }
      .p1 { animation-duration: 6s; }
      .p2 { animation-duration: 9s; animation-delay: 2s; }
      .p3 { animation-duration: 7s; animation-delay: 4s; }
      .p4 { animation-duration: 11s; animation-delay: 1s; }
    </style>
  </defs>

  <!-- Waving Path with Fluid Morphing Animation -->
  <path d="M0,0 L1200,0 L1200,190 C1000,240 800,160 500,230 C200,270 100,230 0,210 Z" fill="url(#grad)">
    <animate attributeName="d" 
             dur="10s" 
             repeatCount="indefinite"
             values="M0,0 L1200,0 L1200,190 C1000,240 800,160 500,230 C200,270 100,230 0,210 Z;
                     M0,0 L1200,0 L1200,215 C1020,175 780,245 480,205 C180,245 80,215 0,235 Z;
                     M0,0 L1200,0 L1200,190 C1000,240 800,160 500,230 C200,270 100,230 0,210 Z" />
  </path>
  
  <!-- Floating ambient particles -->
  <circle cx="150" cy="80" r="4" fill="#22d3ee" class="particle p1" />
  <circle cx="950" cy="120" r="3" fill="#38bdf8" class="particle p2" />
  <circle cx="350" cy="150" r="5" fill="#22d3ee" class="particle p3" opacity="0.5" />
  <circle cx="800" cy="60" r="4" fill="#06b6d4" class="particle p4" />

  <!-- Text Elements aligned visually over the banner -->
  <text x="50%" y="95" dominant-baseline="middle" text-anchor="middle" class="title">Tejaswin Amara</text>
  <text x="50%" y="155" dominant-baseline="middle" text-anchor="middle" class="subtitle">AI-ASSISTED DEVELOPER &amp; TECH SUPPORT SPECIALIST</text>
</svg>
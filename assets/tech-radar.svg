<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes slideInRadial {
        from { opacity: 0; r: 0; }
        to { opacity: 1; r: 8; }
      }
      @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      .tech-ring { animation: rotate 20s linear infinite; transform-origin: 250px 250px; }
      .tech-dot { animation: slideInRadial 0.8s ease-out forwards; }
      .tech-dot:nth-child(2) { animation-delay: 0.1s; }
      .tech-dot:nth-child(3) { animation-delay: 0.2s; }
      .tech-dot:nth-child(4) { animation-delay: 0.3s; }
      .tech-dot:nth-child(5) { animation-delay: 0.4s; }
      .tech-dot:nth-child(6) { animation-delay: 0.5s; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-anchor: middle; fill: #e2e8f0; }
      .ring-accent { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0f172a"/>

  <!-- Concentric rings -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
  <circle cx="250" cy="250" r="100" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
  <circle cx="250" cy="250" r="50" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.2"/>

  <!-- Center nucleus -->
  <circle cx="250" cy="250" r="20" fill="#14b8a6" opacity="0.2"/>
  <circle cx="250" cy="250" r="15" fill="none" stroke="#14b8a6" stroke-width="2"/>

  <!-- Rotating outer ring (accent) -->
  <g class="tech-ring">
    <circle cx="250" cy="250" r="210" fill="none" stroke="#134e4a" stroke-width="1" opacity="0.6" class="ring-accent"/>
  </g>

  <!-- Tech nodes with labels -->
  <!-- TypeScript: Top -->
  <g class="tech-dot">
    <circle cx="250" cy="50" r="8" fill="#3178c6" opacity="0.9"/>
    <circle cx="250" cy="50" r="12" fill="none" stroke="#3178c6" stroke-width="1" opacity="0.4"/>
    <text class="label" x="250" y="30" font-weight="600">TypeScript</text>
  </g>

  <!-- React: Top-right -->
  <g class="tech-dot">
    <circle cx="382" cy="93" r="8" fill="#61dafb" opacity="0.9"/>
    <circle cx="382" cy="93" r="12" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.4"/>
    <text class="label" x="415" y="80" font-weight="600">React</text>
  </g>

  <!-- Next.js: Right -->
  <g class="tech-dot">
    <circle cx="420" cy="250" r="8" fill="#000000" opacity="0.7"/>
    <circle cx="420" cy="250" r="12" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
    <text class="label" x="460" y="258" font-weight="600">Next.js</text>
  </g>

  <!-- Java & Spring: Bottom-right -->
  <g class="tech-dot">
    <circle cx="382" cy="407" r="8" fill="#ed8b00" opacity="0.9"/>
    <circle cx="382" cy="407" r="12" fill="none" stroke="#ed8b00" stroke-width="1" opacity="0.4"/>
    <text class="label" x="415" y="430" font-weight="600">Java/Spring</text>
  </g>

  <!-- Python: Bottom -->
  <g class="tech-dot">
    <circle cx="250" cy="450" r="8" fill="#3776ab" opacity="0.9"/>
    <circle cx="250" cy="450" r="12" fill="none" stroke="#3776ab" stroke-width="1" opacity="0.4"/>
    <text class="label" x="250" y="475" font-weight="600">Python</text>
  </g>

  <!-- PowerShell & Windows: Bottom-left -->
  <g class="tech-dot">
    <circle cx="118" cy="407" r="8" fill="#5391fe" opacity="0.9"/>
    <circle cx="118" cy="407" r="12" fill="none" stroke="#5391fe" stroke-width="1" opacity="0.4"/>
    <text class="label" x="80" y="430" font-weight="600">PowerShell</text>
  </g>

  <!-- Claude & AI: Left -->
  <g class="tech-dot">
    <circle cx="80" cy="250" r="8" fill="#d97757" opacity="0.9"/>
    <circle cx="80" cy="250" r="12" fill="none" stroke="#d97757" stroke-width="1" opacity="0.4"/>
    <text class="label" x="35" y="258" font-weight="600">Claude AI</text>
  </g>

  <!-- Figma & Design: Top-left -->
  <g class="tech-dot">
    <circle cx="118" cy="93" r="8" fill="#f24e1e" opacity="0.9"/>
    <circle cx="118" cy="93" r="12" fill="none" stroke="#f24e1e" stroke-width="1" opacity="0.4"/>
    <text class="label" x="80" y="70" font-weight="600">Design</text>
  </g>

  <!-- Center label -->
  <text x="250" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#14b8a6" font-family="'JetBrains Mono', monospace">Stack</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
  <defs>
    <!-- Background Gradient to match the aesthetic -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .term-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        fill: #94a3b8;
      }
      .prompt {
        fill: #22d3ee;
        font-weight: 700;
      }
      .output {
        fill: #f8fafc;
      }
      
      /* Typing animation classes */
      @keyframes type {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .typing-line {
        opacity: 0;
        animation: type 0.1s forwards;
      }
      .l1 { animation-delay: 0.5s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 2.0s; }
      .l4 { animation-delay: 2.5s; }
      .l5 { animation-delay: 3.5s; }
      .l6 { animation-delay: 4.0s; }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { 
        animation: blink 1s step-end infinite; 
        fill: #22d3ee;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Terminal window box -->
  <g transform="translate(100, 30)">
    <!-- Terminal header -->
    <rect x="0" y="0" width="1000" height="300" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="1000" height="40" rx="10" fill="#1e293b" />
    <rect x="0" y="20" width="1000" height="20" fill="#1e293b" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    <text x="500" y="25" dominant-baseline="middle" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8">guest@tejaswin:~</text>

    <!-- Terminal Content -->
    <g class="term-text" transform="translate(20, 80)">
      <text y="0" class="typing-line l1"><tspan class="prompt">guest@tejaswin</tspan>:<tspan fill="#38bdf8">~</tspan>$ whoami</text>
      <text y="25" class="typing-line l2 output">Tejaswin Amara — B.Tech CSIT Student @ KL University, Hyderabad</text>
      
      <text y="65" class="typing-line l3"><tspan class="prompt">guest@tejaswin</tspan>:<tspan fill="#38bdf8">~</tspan>$ roles</text>
      <text y="90" class="typing-line l4 output">AI-Assisted Developer &amp; Tech Support Specialist · Founder's Office Intern @ Origins India</text>
      
      <text y="130" class="typing-line l5"><tspan class="prompt">guest@tejaswin</tspan>:<tspan fill="#38bdf8">~</tspan>$ philosophy</text>
      <text y="155" class="typing-line l6 output">Details in the bigger picture.<tspan class="cursor">_</tspan></text>
    </g>
  </g>
</svg>

name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch:         # allows a manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Verify SVGs were generated
        run: |
          echo "Contents of dist/:"
          ls -la dist/
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

      - name: Publish to the output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
